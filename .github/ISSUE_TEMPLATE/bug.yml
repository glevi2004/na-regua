name: Defeito
description: Algo funciona diferente do esperado
labels: [bug]
body:
  - type: textarea
    id: o-que-acontece
    attributes:
      label: O que acontece
      description: E o que voce esperava que acontecesse
    validations: { required: true }

  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      value: |
        1.
        2.
        3.
    validations: { required: true }

  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options: [local, staging, production]
    validations: { required: true }

  - type: dropdown
    id: canal
    attributes:
      label: Canal
      description: O mesmo caso de uso roda pelos dois — saber por onde entrou ajuda a isolar
      options: [aplicativo, WhatsApp, backoffice web, API, job em segundo plano]

  - type: input
    id: modulo
    attributes:
      label: Módulo suspeito
      description: 'Ex.: packages/domain — ver docs/arquitetura/modulos.md'

  - type: textarea
    id: evidencia
    attributes:
      label: Evidência
      description: |
        Log, requestId, print. **Remova CPF, telefone e e-mail** antes de colar (LGPD).
