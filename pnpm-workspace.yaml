packages:
  - 'apps/*'
  - 'packages/*'
# Scripts de postinstall aprovados um a um. pnpm bloqueia por padrao — um
# postinstall arbitrario e vetor de supply chain (RNF-029).
#   esbuild          binario nativo usado por tsx e vitest
#   msgpackr-extract aceleracao de serializacao do bullmq
#   unrs-resolver    resolvedor nativo do eslint
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.18'
  - '@expo/config-plugins@57.0.9'
  - '@expo/config@57.0.9'
  - '@expo/fingerprint@0.20.10'
  - '@expo/image-utils@0.11.5'
  - '@expo/metro-config@57.0.10'
  - '@expo/metro-file-map@57.0.2'
  - '@expo/prebuild-config@57.0.14'
  - '@expo/require-utils@57.0.5'
  - babel-preset-expo@57.0.8
  - expo-asset@57.0.14
  - expo-constants@57.0.14
  - expo-modules-autolinking@57.0.11
  - expo-modules-core@57.0.13
  - expo@57.0.16

# vite entra so como engine do vitest (peer). A resolucao natural cai numa
# versao <=6.4.2, que carrega GHSA-fx2h-pf6j-xcff (alta) e mais duas moderadas.
# O gate de auditoria da CI e bloqueante em severidade alta (RNF-029), entao
# forcamos a faixa ja corrigida. O teto <8 existe porque o peer do vitest 3.2
# aceita ate a major 7.
overrides:
  vite: '>=7.3.6 <8'
